# =========================================================
# ProximityAntiXray Configuration
# Author: DarkIgnite
# Ultra-lightweight distance-based hider against Freecam/ESP
# =========================================================

settings:
  # How often (in ticks) the proximity check runs across players (2 ticks = 10 times/second)
  check-interval-ticks: 2
  # How often (in ticks) block update packets are sent
  update-ticks: 1

world-settings:
  default:
    enabled: true
    # Radius in blocks at which the spawner/block becomes visible to the player
    # Freecam users cannot see it because camera movements don't change server coordinates!
    reveal-distance: 6.0
    # Radius in blocks at which the block gets re-hidden when the player walks away
    rehide-distance: 8.0
    # Whether to re-hide the block when the player leaves the radius
    rehide-blocks: true
    # Maximum number of hidden/proximity-tracked blocks per chunk
    max-blocks-per-chunk: 60
    # Blocks that are hidden and revealed only by close physical proximity
    # Leave empty [] to inherit all hidden-blocks from Paper config
    proximity-blocks:
      - spawner
      - trial_spawner
      - vault
      - chest
      - mossy_cobblestone

  world_nether:
    # Nether uses Paper Anti-Xray Engine Mode 1 for ancient_debris. Proximity check not needed.
    enabled: false

  world_the_end:
    enabled: false
