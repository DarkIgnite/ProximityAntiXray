# =========================================================
# ProximityAntiXray Configuration
# Author: DarkIgnite
# Ultra-lightweight distance-based hider against Freecam/ESP
# =========================================================

settings:
  # How often (in ticks) the proximity check runs across players (2 ticks = 10 times/second)
  check-interval-ticks: 2
  # How often (in ticks) block update packets are sent
  update-ticks: 1

world-settings:
  default:
    enabled: true
    # Radius in blocks at which the spawner/block becomes visible to the player
    # Freecam users cannot see it because camera movements don't change server coordinates!
    reveal-distance: 8.0
    # Radius in blocks at which the block gets re-hidden when the player walks away
    rehide-distance: 10.0
    # Whether to re-hide the block when the player leaves the radius
    rehide-blocks: true
    # Maximum number of hidden/proximity-tracked blocks per chunk (without dungeon blocks)
    max-blocks-per-chunk: 60

    # Legacy option maintained for backward compatibility
    fill-dungeon-with-stone: true
    # Radius around the spawner to conceal as solid stone (covers up to 9x9 dungeon rooms)
    dungeon-horizontal-radius: 4
    dungeon-vertical-radius-up: 4
    dungeon-vertical-radius-down: 2

    # Structure Concealment (Anti-Freecam / Anti-ESP)
    # Conceals structures as natural surrounding terrain (stone/deepslate/sandstone/bricks)
    # until a player physically enters/approaches. Once a player interacts with a piece
    # (places torches/blocks, breaks blocks, opens chests/levers), that piece permanently
    # stops re-hiding so player bases and renovations are never ruined!
    structures:
      dungeons: true
      mineshafts: true
      desert-pyramids: true
      jungle-temples: true
      stronghold-portal-room: true
      buried-treasure: true

    # Blocks that are hidden and revealed only by close physical proximity
    # Spawners, dungeon chests, and dungeon rooms are automatically protected by fill-dungeon-with-stone.
    # Player chests and player spawners in bases are NEVER hidden!
    proximity-blocks:
      - trial_spawner
      - vault

  world_nether:
    # Nether uses Paper Anti-Xray Engine Mode 1 for ancient_debris. Proximity check not needed.
    enabled: false

  world_the_end:
    enabled: false
